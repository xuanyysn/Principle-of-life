<!DOCTYPE html>
<html lang="zh-CN">
<head>

        main { padding: 2em; background: white; max-width: 800px; margin: 2em auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { margin-top: 0; }

    </style>
</head>
<body>
    <header>
        <h1>欢迎来到我的个人网站</h1>
    </header>
    <main>
        <section>
            <h2>关于我</h2>
            <p>这里写一些自我介绍的文字，比如兴趣爱好、工作学习经历等。</p>
        </section>
        <section>
            <h2>博客</h2>
            <p>你可以在这里分享文章或者个人感悟。</p>
        </section>
        <section>
            <h2>联系我</h2>
            <p>邮箱：example@example.com</p>
        </section>
    </main>
    <footer>
        &copy; 2024 个人网站
    </footer>

</html>
